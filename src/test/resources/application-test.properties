# Test Configuration
spring.application.name=notification-test

# Disable tracing for faster tests
management.tracing.enabled=false

# MongoDB - will be overridden by TestContainers in integration tests
# Using standard Spring Data MongoDB properties for tests
spring.data.mongodb.uri=mongodb://localhost:27017/notification_test_db
spring.data.mongodb.uuid-representation=standard

# RabbitMQ - will be overridden by TestContainers
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Email Configuration (will be overridden by GreenMail)
spring.mail.host=localhost
spring.mail.port=3025
notification.email.from=test@devoops.com
notification.email.from-name=DevOops Test

# Frontend URL
notification.frontend.url=http://localhost:4200

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.root=WARN
logging.level.com.devoops=DEBUG

# Disable health checks that require external services
management.health.rabbit.enabled=false
management.health.mongo.enabled=false
