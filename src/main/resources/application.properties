# Application
spring.application.name=notification
server.port=${SERVER_PORT:8080}

# MongoDB Configuration
spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=notification_db
spring.mongodb.username=${MONGODB_USERNAME:devoops}
spring.mongodb.password=${MONGODB_PASSWORD:devoops}
spring.mongodb.authentication-database=admin
spring.mongodb.representation.uuid=standard

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:devoops}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:devoops123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# RabbitMQ Queue Names
rabbitmq.exchange.notification=notification.exchange
rabbitmq.exchange.dlx=notification.dlx
rabbitmq.queue.dlq=notification.dlq
rabbitmq.queue.reservation-created=notification.reservation.created.queue
rabbitmq.queue.reservation-cancelled=notification.reservation.cancelled.queue
rabbitmq.queue.host-rated=notification.rating.host.queue
rabbitmq.queue.accommodation-rated=notification.rating.accommodation.queue
rabbitmq.queue.reservation-response=notification.reservation.response.queue
rabbitmq.queue.user-created=user.created.queue

# RabbitMQ Retry Configuration
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0

# Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Sender Configuration
notification.email.from=${MAIL_FROM:noreply@devoops.com}
notification.email.from-name=${MAIL_FROM_NAME:DevOops}

# Frontend URL (for email links)
notification.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Tracing
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://${ZIPKIN_HOST:zipkin}:${ZIPKIN_PORT:9411}/api/v2/spans

# Logging
logging.logstash.host=${LOGSTASH_HOST:localhost:5000}
logging.level.root=INFO
logging.level.com.devoops=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.amqp=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.health.rabbit.enabled=true
management.health.mongo.enabled=true
