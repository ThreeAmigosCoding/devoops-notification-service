fullnameOverride: devoops-notification-service
replicaCount: 1

image:
  registry: docker.io
  repository: threeamigoscoding/devoops-notification-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  httpPort: 8080
  grpc:
    enabled: false

ingress:
  enabled: false

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: 1000m

health:
  path: /actuator/health
  periodSeconds: 10
  failureThreshold: 3
  startup:
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 60

configData:
  JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xms128m -Xmx384m -XX:ActiveProcessorCount=1"
  SERVER_PORT: "8080"
  LOGSTASH_HOST: "devoops-logstash:5000"
  ZIPKIN_HOST: "devoops-jaeger"
  ZIPKIN_PORT: "9411"
  MONGODB_HOST: "devoops-mongodb"
  MONGODB_PORT: "27017"
  RABBITMQ_HOST: "devoops-rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"
  MAIL_HOST: "devoops-mailhog"
  MAIL_PORT: "1025"
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
  MAIL_FROM: "noreply@devoops.com"
  MAIL_FROM_NAME: "DevOops"
  FRONTEND_URL: "http://localhost:4200"

secretData:
  MONGODB_USERNAME: "devoops"
  MONGODB_PASSWORD: "devoops"
  RABBITMQ_USERNAME: "devoops"
  RABBITMQ_PASSWORD: "devoops123"
